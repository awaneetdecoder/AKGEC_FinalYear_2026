# One command: MySQL 8 + the Spring Boot backend (which also serves the Staff Portal)
#   cp .env.example .env   (edit it)   &&   docker compose up --build
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: swachhdrishti
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./swachhdrishti-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/swachhdrishti?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STAFF_ACCESS_CODE: ${STAFF_ACCESS_CODE:-swachh-staff-2026}
      ROBOFLOW_MOCK: ${ROBOFLOW_MOCK:-true}
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
      ROBOFLOW_MODEL_URL: ${ROBOFLOW_MODEL_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DEMO_MODE: ${DEMO_MODE:-false}

volumes:
  dbdata:
